  https_note: >-
    TCP 443 accepts the connection then resets before a TLS handshake completes
    (curl error 35, "Recv failure: Connection reset by peer"). There is no TLS
    endpoint, so every probe below had to be run over plain HTTP.
  note: >-
    The registration date (2014-11-11) matches Metacrine's 2014 founding, so this IS the
    company's original domain — it has simply lapsed into Network Solutions' pending-renewal-
    deletion holding state and been pointed at parking. 208.91.197.132 is Confluence Networks
    (Media.net) parking infrastructure; the served robots.txt is Media.net parking boilerplate
    (Disallow: /fcmedianet.js, /__media__/js/templates.js, /cmedianet) and is not Metacrine's.

