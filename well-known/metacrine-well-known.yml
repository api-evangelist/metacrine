description: >-
  Negative probe record for Metacrine. Metacrine, Inc. (Nasdaq: MTCR) was a San Diego
  clinical-stage biopharmaceutical company. Its stockholders approved a Plan of Dissolution
  on 2023-03-23 and the company filed a Certificate of Dissolution with the Delaware
  Secretary of State on 2023-03-24, effective on filing. Its domain metacrine.com has since
  lapsed: the registration is delegated to Network Solutions' expired-domain nameservers
  (NS1/NS2.PENDINGRENEWALDELETION.COM) and wildcarded to a Media.net parking address, which
  answers HTTP 200 with a 122- or 195-byte "Error. Page cannot be displayed" stub for EVERY
  path on EVERY host. NONE of those 200s is a document. No WellKnown, SecurityTxt, AgentCard,
  LLMsTxt or OpenAPI pointer is emitted from this probe, and none should ever be emitted from
  it in a later round.

