aid: metacrine
name: Metacrine
description: >-
  Metacrine, Inc. was a San Diego, California clinical-stage biopharmaceutical company founded
  in 2014 to develop differentiated therapies for liver and gastrointestinal disease. It built a
  proprietary farnesoid X receptor (FXR) platform on a distinct chemical scaffold and advanced two
  oral, once-daily FXR agonists — MET409 and MET642 — through Phase 1 and Phase 2 trials in
  non-alcoholic steatohepatitis (NASH), alongside exploratory work in inflammatory bowel disease.
  Backed by ARCH Venture Partners, Polaris Partners, venBio and EcoR1 Capital, it raised a $36M
  round in 2015 and a $65M Series C in June 2018 before pricing an initial public offering on
  2020-09-15 of 6,540,000 shares at $13.00, for roughly $85.0M gross, and listing on the Nasdaq
  Capital Market as MTCR. Equillium, Inc. agreed to acquire the company in an all-stock transaction
  announced 2022-09-06, but the two mutually terminated the merger agreement on 2022-12-23. The
  board approved a Plan of Dissolution on 2023-01-24; Nasdaq issued a minimum-bid-price delisting
  notice on 2023-01-31, trading was suspended on 2023-02-09 and delisting took effect 2023-03-13;
  the FXR program assets were sold under a February 2023 term sheet for up to $4.0M in cash plus
  assumed liabilities; stockholders approved the dissolution on 2023-03-23; and the company filed
  a Certificate of Dissolution with the Delaware Secretary of State on 2023-03-24, effective on
  filing under DGCL Section 275. Metacrine was a drug developer, not a software vendor, and it
  never published a developer program, public API, SDK, webhook surface, or machine-readable
  specification of any kind. Its domain metacrine.com has since lapsed and is parked. This profile
  is retained as a historical record; there is no API surface to enrich.
